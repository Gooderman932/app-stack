version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      fastapi:
        patterns:
          - "fastapi"
          - "starlette"
          - "uvicorn"
          - "pydantic*"
      google-ai:
        patterns:
          - "google-ai-*"
          - "google-generativeai"
          - "google-genai"
          - "google-api-*"
          - "google-auth*"
      aws:
        patterns:
          - "boto3"
          - "botocore"
          - "s3transfer"
      lint-test:
        patterns:
          - "pytest"
          - "flake8"
          - "black"
          - "mypy"
          - "isort"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      radix:
        patterns:
          - "@radix-ui/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "react-router*"
      capacitor:
        patterns:
          - "@capacitor/*"
    ignore:
      # The frontend is Create React App (react-scripts 5) with a Tailwind 3
      # JS config. Tailwind 4 needs the @tailwindcss/postcss plugin and a
      # CSS-first config; a lone Dependabot bump to 4.x broke the build.
      # Upgrade Tailwind together with the move off CRA (e.g. to Vite).
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
