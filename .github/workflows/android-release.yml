name: Android release (AAB)

# Builds the signed Android App Bundle to upload to Google Play.
# Setup, secrets and variables: docs/android-release.md.

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "versionCode: a whole number higher than every build already uploaded to Play"
        required: true
      version_name:
        description: "versionName shown to users, e.g. 1.0.0"
        required: true
        default: "1.0.0"

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  bundle:
    name: Build signed AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Inputs and variables are only ever read from the environment, never
      # pasted into scripts, so they cannot inject shell commands.
      VERSION_CODE: ${{ inputs.version_code }}
      VERSION_NAME: ${{ inputs.version_name }}
      REACT_APP_BACKEND_URL: ${{ vars.REACT_APP_BACKEND_URL }}
      REACT_APP_GOOGLE_CLIENT_ID: ${{ vars.REACT_APP_GOOGLE_CLIENT_ID }}
    steps:
      - name: Check inputs, variables and secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          fail=0
          if ! [[ "$VERSION_CODE" =~ ^[1-9][0-9]{0,9}$ ]] || (( VERSION_CODE > 2100000000 )); then
            echo "::error::version_code must be a whole number from 1 to 2100000000"; fail=1
          fi
          if ! [[ "$VERSION_NAME" =~ ^[0-9A-Za-z][0-9A-Za-z.+_-]{0,49}$ ]]; then
            echo "::error::version_name may use letters, digits and . + _ - (e.g. 1.0.0)"; fail=1
          fi
          if ! [[ "$REACT_APP_BACKEND_URL" =~ ^https://[^[:space:]]+$ ]]; then
            echo "::error::Set the repository variable REACT_APP_BACKEND_URL to the live https:// backend URL"; fail=1
          fi
          if ! [[ "$REACT_APP_GOOGLE_CLIENT_ID" =~ \.apps\.googleusercontent\.com$ ]]; then
            echo "::error::Set the repository variable REACT_APP_GOOGLE_CLIENT_ID to the web OAuth client ID"; fail=1
          fi
          for name in KEYSTORE_BASE64 KEY_STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then echo "::error::Missing repository secret $name"; fail=1; fi
          done
          exit "$fail"

      - uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # Capacitor 8 compiles with Java 21.
          java-version: '21'
          cache: gradle

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install web dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Patch ajv (CRA/react-scripts compatibility)
        working-directory: frontend
        run: npm install --no-save --legacy-peer-deps ajv@^8 ajv-keywords@^5

      - name: Build web app
        working-directory: frontend
        env:
          CI: 'false'
        run: npm run build

      - name: Copy web app and plugins into the Android project
        working-directory: frontend
        run: npx cap sync android

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"

      - name: Build signed release bundle
        working-directory: frontend/android
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease -PVERSION_CODE="$VERSION_CODE" -PVERSION_NAME="$VERSION_NAME"

      - name: Verify signature
        env:
          AAB: frontend/android/app/build/outputs/bundle/release/app-release.aab
        run: |
          set -euo pipefail
          jarsigner -verify "$AAB" | tee "$RUNNER_TEMP/verify.txt"
          grep -q '^jar verified' "$RUNNER_TEMP/verify.txt"
          fingerprint=$(keytool -printcert -jarfile "$AAB" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n1)
          {
            echo "### App Stack ${VERSION_NAME} (versionCode ${VERSION_CODE})"
            echo ""
            echo "Upload certificate SHA-256: \`${fingerprint}\`"
            echo ""
            echo "It must match **Play Console → Test and release → App integrity → Upload key certificate**."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"

      - uses: actions/upload-artifact@v7
        with:
          name: app-stack-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
