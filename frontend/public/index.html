<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <!--
        No viewport-fit=cover: on Android, Capacitor 8 then pads the WebView
        below the status and navigation bars itself, so the layout needs no
        safe-area CSS. Add it only together with safe-area padding.
        -->
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#000000" />
        <meta
            name="description"
            content="App Stack: AI-generated deployment guides and documentation for your projects."
        />
        <title>App Stack</title>
        <!--
        Keep third-party scripts out of this file. The app keeps its session
        token in the browser, so any script loaded here can read it, and the
        Android app ships this page inside the APK. Analytics or monitoring
        must be added from the app's own code, disclosed in the privacy policy
        and in the Play Console Data safety form.
        -->
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
